<?xml version="1.0" encoding="UTF-8"?>
<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db"/>
      <stop offset="100%" style="stop-color:#9b59b6"/>
    </linearGradient>
    <linearGradient id="screen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2c3e50"/>
      <stop offset="100%" style="stop-color:#34495e"/>
    </linearGradient>
  </defs>
  
  <!-- 背景圆角矩形 -->
  <rect x="8" y="8" width="240" height="240" rx="40" fill="url(#bg)"/>
  
  <!-- 屏幕外框 -->
  <rect x="40" y="50" width="176" height="120" rx="8" fill="url(#screen)"/>
  
  <!-- 屏幕内容 -->
  <rect x="50" y="60" width="156" height="100" rx="4" fill="#1a252f"/>
  
  <!-- 屏幕底座 -->
  <rect x="100" y="170" width="56" height="10" fill="#2c3e50"/>
  <rect x="80" y="180" width="96" height="8" rx="4" fill="#2c3e50"/>
  
  <!-- 录制红点 -->
  <circle cx="190" cy="75" r="12" fill="#e74c3c"/>
  <circle cx="190" cy="75" r="6" fill="#c0392b"/>
  
  <!-- 画笔 -->
  <g transform="translate(140, 90) rotate(-45)">
    <!-- 笔身 -->
    <rect x="0" y="0" width="60" height="14" rx="2" fill="#f39c12"/>
    <!-- 笔尖 -->
    <polygon points="60,0 75,7 60,14" fill="#ecf0f1"/>
    <!-- 笔端 -->
    <rect x="-8" y="0" width="8" height="14" rx="2" fill="#e74c3c"/>
  </g>
  
  <!-- 标注线条装饰 -->
  <line x1="60" y1="90" x2="100" y2="90" stroke="#27ae60" stroke-width="3" stroke-linecap="round"/>
  <rect x="60" y="100" width="50" height="30" rx="3" stroke="#3498db" stroke-width="2" fill="none"/>
  
</svg>
